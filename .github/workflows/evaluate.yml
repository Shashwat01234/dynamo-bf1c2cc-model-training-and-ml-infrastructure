name: Task Evaluation

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ submission, main ]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install torch==2.6.0 numpy==2.2.3 pytest==8.4.1 pytest-json-ctrf==0.3.5

      - name: Run oracle solution (patches environment/data files)
        run: |
          python task/solution/solve.py

      - name: Run verifier tests
        run: |
          pytest task/tests/test_outputs.py -v --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: task/tests/
